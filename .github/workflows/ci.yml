name: CI

# 2026-09-25 (aynı gün, ikinci düzeltme): DEPO ARTIK PUBLIC.
# Public depoda GitHub Actions ücretsiz, yani push tetikleyicisi geri açıldı.
#
# Aynı gün önce kaldırılmıştı, sebebi şuydu: depo private iken her push tam
# bir npm ci + test + build çalıştırıyordu; beş günden kısa sürede 30 çalışma
# birikti ve kota tükendi (22 Eylül 23:16'dan itibaren işler başlayamadan
# düşüyordu). Depo public olunca bu maliyet ortadan kalktı.
#
# Tasarruf önlemleri YİNE DE DURUYOR — ücretsiz olması savurgan olmasını
# gerektirmiyor ve depo tekrar private yapılırsa koruma hazır olsun:
#   paths-ignore  — yalnızca metin değişen commit'ler iş çalıştırmaz
#   concurrency   — art arda iki push, iki tam çalışma yerine bir tane harcar
#   timeout       — takılan tek bir iş saatlerce koşamaz
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Varsayılan sınır 360 dakika. Bu proje normalde 40 saniyede bitiyor.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
